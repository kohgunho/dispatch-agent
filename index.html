${crDraft.impact?`<div style="margin-top:18px"><b>③ 변경 영향도</b><div class="grid g3" style="margin-top:10px">${crDraft.impact.map(x=>`<div class="mock"><b>${x}</b><p>기존 Baseline 대비 재검토 필요</p></div>`).join('')}</div>

<div class="card"><b>⑤ O-NE IT운영 승인</b><label>승인 담당자</label><select style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px" onchange="crDraft.approver=this.value">${itOpsApprovers.map(x=>`<option ${crDraft.approver===x?'selected':''}>${x}</option>`).join('')}</select><div class="row" style="margin-top:12px"><span style="font-size:13px;color:#64748b">승인 후 ${r.version} → <b>${crDraft.versionTo}</b> Baseline 변경 및 관련자 Notification</span><button class="btn green" onclick="submitCR()">승인 요청</button></div></div></div>`:''}</div>`}

function capacityHtml(){return `<div class="grid g4"><div class="kpi"><b>${team.length}명</b><div>팀 인원</div></div><div class="kpi"><b>40H</b><div>인당 주간 가용</div></div><div class="kpi"><b>${Math.round(team.reduce((a,b)=>a+b.load,0)/team.length)}%</b><div>평균 가동률</div></div><div class="kpi"><b>${team.reduce((a,b)=>a+b.remain,0).toFixed(1)}H</b><div>총 잔여 CAPA</div></div></div>
<div class="card"><div class="row"><div><b>신규 SR 배정 프로세스</b><div class="flowlegend">각 단계의 큰 숫자는 <b>현재 단계 건수</b>, 하단은 해당 단계까지 도달한 <b>누적 건수</b>입니다. 클릭하면 해당 단계 요구사항 현황으로 이동합니다.</div></div><span class="tag">전체 ${reqs.length}건</span></div>
<div class="flow">${stageNames.map((name,i)=>{let n=i+1,exact=stageExactCount(n),cum=stageCumulativeCount(n);return `<div class="flowstep ${exact?'active':''}" onclick="openStageList(${n})"><div class="n">STEP ${n}</div><div class="count">${exact}건</div><div class="name">${name}</div><div class="cum">누적 ${cum}건</div></div>`}).join('')}</div></div>
<div class="card"><b>인원별 Capacity / 담당 모듈</b>${team.map(m=>`<div style="margin:16px 0"><div class="row"><div><b>${m.name}</b><div style="font-size:12px;color:#64748b">${m.modules.join(' · ')}</div></div><span>${m.load}% 가동 / 잔여 ${m.remain}H</span></div><div class="bar"><div style="width:${m.load}%"></div></div></div>`).join('')}</div>`}
function workflowHtml(){return `<div class="card"><b>Workflow 상태 트랙</b><div class="steps" style="margin-top:16px">${['작성중','요구사항 제출','검토중','요구사항 확정','개발중','테스트중','배포완료'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><div class="grid g3" style="margin-top:18px"><div class="mock"><b>Communication Agent</b><p>Requirement / Mock-up / Version / Decision / Action</p></div><div class="mock"><b>LoIS ServIN</b><p>SR 임시저장 / 정식등록 / 승인</p></div><div class="mock"><b>CJL Jira</b><p>개발 / 리뷰 / 테스트 / 배포</p></div></div></div>`}
function assetsHtml(){return `<div class="grid g2"><div class="card"><b>시스템 자산</b><div class="grid g2" style="margin-top:12px"><div class="mock">Screen<br><b>77</b></div><div class="mock">ERD / Table<br><b>연계예정</b></div><div class="mock">Field 정의<br><b>연계예정</b></div><div class="mock">기존 SR/History<br><b>4</b></div></div></div><div class="card"><b>Agent 분석 활용</b><p>• 기존·유사 기능 검색</p><p>• 중복 요청 방지</p><p>• 영향도 분석 Context</p><p>• Version 비교</p></div></div><div class="card"><b>Lifecycle 연계 구조</b><div class="flow"><div class="flowstep active"><div class="name">Requirement</div><div class="cum">Communication Agent</div></div><div class="flowstep active"><div class="name">ServIN SR</div><div class="cum">요청/승인 ID</div></div><div class="flowstep active"><div class="name">Jira Ticket</div><div class="cum">개발/테스트/배포</div></div><div class="flowstep active"><div class="name">현황 자동반영</div><div class="cum">고객테스트/배포</div></div></div></div>`}
function goStatusDashboard(kind){
 statusStageFilter=null;statusQuickFilter=null;
 if(kind==='unassigned')statusQuickFilter='unassigned';
 if(kind==='servin')statusQuickFilter='servin';
 if(kind==='jira')statusQuickFilter='jira';
 if(kind==='test')statusQuickFilter='test';
 if(kind==='confirmed')statusQuickFilter='confirmed';
 active='status';nav();document.getElementById('title').textContent='📊 요구사항 현황';render();
}
function goCapacity(){active='capacity';nav();document.getElementById('title').textContent='👥 Capacity 관리';render()}

function lifecycleAudit(){
 let errors=[];
 reqs.forEach(r=>{
  if(!r.owner && r.assignDate!=='-') errors.push(`${r.id}: 미배정인데 배정일 존재`);
  if(['고객테스트 요청','테스트중','개발중','검토중','요구사항 제출','요구사항 확정','임시저장','반려'].includes(r.status)&&r.deployDate!=='-') errors.push(`${r.id}: ${r.status}인데 배포일 존재`);
  if(r.integration.jira==='-' && r.integration.jiraStatus!=='임시저장') errors.push(`${r.id}: Jira 미연계 상태 불일치`);
  if(r.status==='임시저장' && r.owner) errors.push(`${r.id}: 임시저장인데 담당자 배정됨`);
 });
 return errors;
}
function dashboardHtml(){let statusData=[['작성/접수',reqs.filter(r=>r.stage<=2).length],['분석/배정',reqs.filter(r=>r.stage>=3&&r.stage<=6).length],['Assign',reqs.filter(r=>r.stage===7).length],['수행/모니터링',reqs.filter(r=>r.stage===8).length]],max=Math.max(1,...statusData.map(x=>x[1]));return `<div class="grid g4"><div class="kpi clickkpi" onclick="goStatusDashboard('confirmed')"><b>3.2일</b><div>요구사항 확정 Lead Time · 현황보기</div></div><div class="kpi clickkpi" onclick="goStatusDashboard('confirmed')"><b>68%</b><div>First Pass 확정률 · 현황보기</div></div><div class="kpi clickkpi" onclick="goStatusDashboard('jira')"><b>12%</b><div>개발 후 변경률 · Jira 현황</div></div><div class="kpi clickkpi" onclick="goStatusDashboard('unassigned')"><b>8%</b><div>요구사항 재작성률 · 현황보기</div></div></div>
<div class="grid g2"><div class="card"><b>요구사항 Lifecycle 현황</b><div class="chartbox">${statusData.map((x,i)=>`<div class="barcol" style="cursor:pointer" onclick="${i===0?"openStageList(1)":i===1?"openStageList(4)":i===2?"openStageList(7)":"openStageList(8)"}"><div class="barval">${x[1]}건</div><div class="barv" style="height:${Math.max(6,x[1]/max*160)}px"></div><div class="barlabel">${x[0]}</div></div>`).join('')}</div></div><div class="card"><div class="row"><b>요청 유형 비중</b><span class="tag">Sample 포함</span></div><div class="donut"></div><div class="grid g2" style="font-size:12px"><div>● 기능개선 34%</div><div>● 신규화면 24%</div><div>● Interface 18%</div><div>● Batch/기타 13%</div><div>● 기타 11%</div></div></div></div>
<div class="grid g2"><div class="card"><b>Agent Usage 현황</b><div class="grid g4" style="margin-top:12px"><div class="kpi"><b>1,248회</b><div>총 사용횟수</div></div><div class="kpi"><b>28.6M</b><div>Token</div></div><div class="kpi"><b>₩1,342</b><div>SR당 평균 비용</div></div><div class="kpi"><b>4.2분</b><div>평균 처리시간</div></div></div><div class="chartbox">${[['요구분석',420],['추가질의',315],['영향도',245],['Mock-up',168],['CR분석',100]].map(x=>`<div class="barcol"><div class="barval">${x[1]}</div><div class="barv" style="height:${x[1]/420*150}px"></div><div class="barlabel">${x[0]}</div></div>`).join('')}</div></div><div class="card clickkpi" onclick="goCapacity()"><div class="row"><b>팀 Capacity</b><span class="tag">Capacity 관리로 이동</span></div>${team.map(m=>`<div style="margin:14px 0"><div class="row"><span><b>${m.name}</b> · ${m.modules.join('/')}</span><span>${m.load}% / 잔여 ${m.remain}H</span></div><div class="bar"><div style="width:${m.load}%"></div></div></div>`).join('')}</div></div>
<div class="grid g2"><div class="card"><b>ServIN / Jira 연계 현황</b><div class="grid g3" style="margin-top:12px"><div class="kpi clickkpi" onclick="goStatusDashboard('servin')"><b>${reqs.filter(r=>r.integration.servin.startsWith('SR-')).length}</b><div>ServIN 정식 SR · 현황보기</div></div><div class="kpi clickkpi" onclick="goStatusDashboard('jira')"><b>${reqs.filter(r=>r.integration.jira!=='-').length}</b><div>Jira 연계 · 현황보기</div></div><div class="kpi clickkpi" onclick="goStatusDashboard('test')"><b>${reqs.filter(r=>r.integration.jiraStatus==='고객테스트 요청').length}</b><div>고객테스트 요청 · 현황보기</div></div></div></div><div class="card"><b>지연 Risk / 확인 필요</b>${reqs.filter(r=>!r.owner||r.integration.jiraStatus==='고객테스트 요청').map(r=>`<div class="mock" style="margin-top:9px"><div class="row"><b>${r.id}</b><span class="tag">${!r.owner?'미배정':r.integration.jiraStatus}</span></div><p>${r.title}</p></div>`).join('')||'<p>현재 확인 필요 건 없음</p>'}</div></div>
<div class="card"><b>최근 6개월 요구사항 처리 추이</b><div class="chartbox">${[['5월',18],['6월',24],['7월',31],['8월',29],['9월',42],['10월',reqs.length]].map(x=>`<div class="barcol"><div class="barval">${x[1]}</div><div class="barv" style="height:${x[1]/42*160}px"></div><div class="barlabel">${x[0]}</div></div>`).join('')}</div><div style="font-size:11px;color:#64748b;margin-top:10px">※ 5~9월은 화면 구성 확인용 Demo 데이터이며 실제 연계 시 운영 실데이터로 대체합니다.</div></div>`}
nav();render();
</script></body></html>
